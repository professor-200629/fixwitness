<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FixWitness: your repair record and estimate.">
  <meta name="theme-color" content="#101414">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FixWitness">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FixWitness</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start fetching the app code and the renderer right away, in parallel
       with the bootstrap script, instead of one after the other. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #101414; }
    #fw-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #dbe5e3; text-align: center; padding: 24px; box-sizing: border-box;
    }
    #fw-loading .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid #2c3a38; border-top-color: #4fd8cf;
      animation: fw-spin 0.9s linear infinite;
    }
    #fw-loading small { color: #8fa3a0; }
    @keyframes fw-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #fw-loading .spinner { animation: none; } }
  </style>
</head>
<body>
  <!-- Plain HTML, shown instantly while the app downloads; removed once
       Flutter draws its first frame. -->
  <div id="fw-loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div id="fw-loading-title">Opening FixWitness…</div>
    <small>This can take a few seconds on a mobile connection.</small>
  </div>
  <script>
    if (/^#\/r\//.test(location.hash)) {
      document.getElementById('fw-loading-title').textContent = 'Loading your repair…';
    }
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('fw-loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
