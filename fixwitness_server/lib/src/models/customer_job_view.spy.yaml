### Everything a customer sees through their link. Built on the server from
### customer-visible records only.
class: CustomerJobView
fields:
  shopName: String
  jobNumber: int
  deviceLabel: String
  customerName: String
  reportedFault: String
  status: JobStatus
  currency: String
  authorization: AuthorizationState
  currentEstimate: Estimate?
  estimates: List<Estimate>
  decisions: List<EstimateDecision>
  ### The first condition report: the state of the device when it was handed in.
  condition: ConditionReport?
  ### Later checks, oldest first. Earlier reports are never changed, so both
  ### sides see every check.
  conditionUpdates: List<ConditionReport>?
  photos: List<CustomerPhoto>
  notes: List<JobNote>
  history: List<JobEvent>
  linkExpiresAt: DateTime
  canDecide: bool
  canAcknowledgeCollection: bool
